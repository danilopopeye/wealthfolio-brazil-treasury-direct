name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

jobs:
  release:
    timeout-minutes: 15
    runs-on: docker

    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: install pnpm
        run: npm install -g pnpm@10.33.0

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # Test gate before packaging, so tagged releases never ship a broken
      # addon. The bundle step runs its own typecheck, but tests cover the
      # parsing and matching logic the catalog depends on.
      - name: test
        run: pnpm test

      - name: check package version matches tag
        env:
          TAG: ${{ forgejo.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "package.json version ($version) does not match tag ($TAG)" >&2
            exit 1
          fi

      - name: bundle addon
        run: pnpm bundle

      # Keep the raw build output out of the release: only the installable
      # addon zip becomes a downloadable asset.
      - name: collect release assets
        run: |
          mkdir -p release
          cp dist/*.zip release/

      - name: create release & upload assets
        uses: actions/forgejo-release@6a9510a9ea01b8b9b435933bf3c0fa45597ad530 # v2.11.3
        with:
          direction: upload
          tag: ${{ forgejo.ref_name }}
          title: ${{ forgejo.ref_name }}
          release-dir: release
          token: ${{ secrets.FORGEJO_TOKEN }}
